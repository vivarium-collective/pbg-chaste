scientific_argument:
  main_claim: |
    A process-bigraph wrapper over PyChaste can reproduce a published Chaste result
    quantitatively — but only where the upstream Python bindings cover the classes the
    publication used; binding coverage, not modelling fidelity, is the binding constraint.
  evidence_for: []
  evidence_against: []
  key_figures: []
  caveats:
    - "No simulations have been run yet. Every claim here is a design-time expectation."
    - |
      The paper's repo ships with paper parameters COMMENTED OUT and short CI values active
      (cell sorting: t_end 11.0 in-repo vs 100 in the paper). The C++ baseline is only a
      baseline if those blocks are restored first — a silent way to produce a wrong reference.
    - |
      Chaste under amd64 emulation on Apple Silicon is slow. The paper's sorting runs are
      20x20 cells to t=100 across 5 models x 10 seeds x 9 k_pert values; the full Fig 3 sweep
      is likely infeasible on this laptop and may need the Mac mini or a reduced sweep.
    - |
      The paper's own figures are NOT the reference — the authors' C++ output is. Divergence
      between our PyChaste run and their C++ run is the measurement; divergence between either
      and the published PNG is not interpretable.

biological_story: |
  When embryonic cells of two types are mixed, they spontaneously unmix — one type engulfing
  the other — driven purely by differences in how strongly like and unlike cells adhere. This
  is the differential adhesion hypothesis, and it is one of the oldest and cleanest examples
  of self-organisation in tissue: no cell knows the target pattern, yet the pattern reliably
  emerges from local adhesive preference plus random motion.

  The modelling question is that every class of cell-based model claims to capture this. A
  cellular automaton represents a cell as a lattice site; a Potts model as a set of sites; an
  overlapping-spheres model as a particle; a Voronoi model as a tessellation region; a vertex
  model as a polygon. All five can be tuned to sort. Osborne et al. asked whether they sort
  the SAME WAY — and found they do not: CA, CP and VM reach full engulfment, while OS and VT
  stall at a local energy minimum and, given long enough, fully separate instead. Random cell
  motion is what lets a model escape that minimum, which is why the noise multiplier k_pert
  is the axis they sweep.

  Our reproduction targets that specific claim — the fractional boundary length trajectory,
  which measures how much interface remains between unlike cells as sorting proceeds.

at_a_glance:
  - {study: cbc-01-cxx-reference-baseline, role: "Build the authors' C++ code and generate the ground-truth sorting baseline"}
  - {study: cbc-02-onlattice-wrapper-extension, role: "Extend pbg-chaste to on-lattice populations, ghost nodes, differential adhesion and cell labels"}
  - {study: cbc-03-random-motion-equivalence, role: "Adversarial: test whether mainline DiffusionForce really equals the paper's custom RandomMotionForce"}
  - {study: cbc-04-cell-sorting-reproduction, role: "Reproduce Figs 2-3 across the reachable model classes and diff against cbc-01"}

how_to_read: |
  Read cbc-01 as the reference and cbc-04 as the result; cbc-02 is plumbing and cbc-03 is the
  load-bearing assumption that cbc-04 rests on. If cbc-03 refutes the DiffusionForce
  equivalence, cbc-04's OS/VT/VM arms lose their random-motion term and the investigation
  reduces to CP only — that is the single biggest risk on the board.

glossary:
  - {term: "CA", definition: "Cellular automaton — one cell per lattice site; movement by division-driven shoving and Metropolis swaps."}
  - {term: "CP", definition: "Cellular Potts — a cell is a set of lattice sites; evolves by Metropolis spin copies minimising a Hamiltonian."}
  - {term: "OS", definition: "Overlapping spheres — cells are particles with radii, interacting by a spring force within a cutoff."}
  - {term: "VT", definition: "Voronoi tessellation — cell shape is the Voronoi region of its centre; neighbours from the Delaunay dual. Requires ghost nodes."}
  - {term: "VM", definition: "Vertex model — a cell is a polygon whose vertices move under an energy balance."}
  - {term: "Fractional boundary length", definition: "Length of interface between unlike cells / total interface length. The paper's sorting measure; 1 = fully mixed, 0 = fully sorted. Column 1 / column 2 of heterotypicboundary.dat."}
  - {term: "k_pert", definition: "Multiplier on the baseline noise level (temperature T for CA/CP, perturbation magnitude xi for OS/VT/VM). Swept 1e-2..1e2 in Fig 3."}
  - {term: "Ghost nodes", definition: "Non-cell nodes surrounding a VT tissue that keep Voronoi regions finite and suppress spurious long Delaunay edges."}
  - {term: "Trampoline", definition: "pybind11's mechanism for letting C++ virtual calls dispatch into a Python override. Present but non-functional for Chaste forces in this image."}

guidelines:
  literature_anchors:
    - "Osborne et al. 2017, PLOS Comput Biol 13(2):e1005387 — Tables 1 & 2 hold every parameter for the sorting case study."
  parameter_catalog:
    - "Shared (Table 1): dt = 0.01 h (CA/CP), 0.005 h (OS/VT/VM); mu = 50.0 (OS/VT); k_C = 5 (OS); l_r = 0.1 CD (VM)."
    - "Sorting (Table 2): L_x = L_y = 20 CD; t_end = 100 h; mu_het = 0.1 (OS/VT); r_max = 2.5 (OS); T = 0.1 (CA), 0.2 (CP); xi = 0.05 (OS), 0.1 (VT/VM); k_pert in [1e-2, 1e2]."
    - "From the authors' code, NOT the paper: OS cutoff 2.5 + RandomMotionForce 0.05; VT 20 ghost layers + RandomMotionForce 0.1; VM NagaiHonda deformation 50, membrane 1.0, adhesion 1.0/2.0/1.0, boundary 10.0/20.0 + RandomMotionForce 0.1; CP temperature 0.2, volume constraint (16, 0.1), surface-area constraint (16, 0.01)."
  calibration_targets:
    - "Fractional boundary length vs time, per model, at k_pert = 1 (the black curves of Fig 3, left) — matched against cbc-01's C++ output, not against the published figure."

