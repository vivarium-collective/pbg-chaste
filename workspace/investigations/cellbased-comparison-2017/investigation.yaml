competing_frameworks:
  - name: "Compare against the published figures instead of regenerated C++ output"
    relation: |
      Rejected. The paper's figures are rasterised summaries of 10-seed means; reading curves off
      them cannot separate a genuine wrapper bug from digitisation error or seed variation. The
      authors' code is available, so the stronger reference is achievable and was chosen.
  - name: "Reimplement the five model classes directly rather than driving Chaste"
    relation: |
      Rejected, and it would answer a different question. The paper's entire point is that all five
      models share one framework; a reimplementation would reintroduce exactly the cross-framework
      artifacts Chaste exists to eliminate. pbg-chaste's contract is to drive the real engine.

acceptance_criteria:
  - {study: cbc-01-cxx-reference-baseline, behavior: cxx-baseline-reproduces-paper-figure-2-qualitatively}
  - {study: cbc-02-onlattice-wrapper-extension, behavior: onlattice-populations-run-and-emit-heterotypic-boundary}
  - {study: cbc-03-random-motion-equivalence, behavior: diffusion-force-matches-random-motion-force-trajectory}
  - {study: cbc-04-cell-sorting-reproduction, behavior: fractional-length-matches-cxx-baseline-within-seed-spread}
