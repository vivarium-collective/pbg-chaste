expected_behavior:
  - name: diffusion-force-matches-random-motion-force-trajectory
    observable: fractional_boundary_length_trajectory
    condition: |
      For OS at k_pert = 1, the PyChaste + DiffusionForce fractional-length trajectory lies within
      the C++ + RandomMotionForce 10-seed spread from cbc-01 at every sampled timepoint.
    rationale: |
      The end-to-end test at the level the investigation actually reports. If the substitution is
      sound anywhere it must hold for OS, the simplest off-lattice model.

  - name: single-cell-displacement-distribution-matches
    observable: single_cell_displacement_msd
    condition: |
      For one isolated cell with no other forces, mean squared displacement over 1000 steps agrees
      with the analytic 2*D*t*DIM to within 3 standard errors, for both forces.
    rationale: |
      Isolates the noise term from adhesion and from sorting dynamics. If the forces diverge, this
      says so unambiguously and cheaply; if they agree here but not end-to-end, the fault is in
      the coupling, not the force law.

  - name: zero-radius-failure-is-explicit
    observable: exception_on_zero_radius
    condition: |
      Constructing a VM or VT simulation with DiffusionForce and unset node radii raises the
      documented Chaste exception rather than silently producing zero noise.
    rationale: |
      An adversarial check on the failure mode itself. A silent zero-noise run is the dangerous
      outcome — it would look like a converged simulation while having disabled the exact
      mechanism the paper says drives escape from the local minimum.

baseline: []
variants: []
interventions: []
runs: []

early_findings:
  - summary: |
      PARTIAL REFUTATION already in hand (from cbc-02, before this study runs): DiffusionForce
      is mechanically unusable as the RandomMotionForce substitute for the VT model, independent
      of any trajectory comparison.
    evidence: |
      cbc-02 probes/probe_vt3.py: MeshBasedCellPopulation re-triangulates every timestep,
      discarding node radius attributes; DiffusionForce divides force by radius and throws on 0,
      while RandomMotionForce does not. Confirmed: all 64 VT nodes lose their radius after one
      plain solve. OS and VM are unaffected.
    interpretation: |
      Narrows this study's remaining scope to OS and VM, where DiffusionForce DOES run. The
      equivalence question there is still open and is what the trajectory/MSD tests below decide.
      For VT the answer is already "no" — the fix is a custom binding, not a configuration.
    status: supported
    links: [cbc-02-onlattice-wrapper-extension]

notes: |
  If refuted, the escalation is a custom PyChaste image compiling RandomMotionForce with proper
  pybind holder types — which would also unblock CA's switching rule and thus the whole 5-model
  set. Refutation is therefore not purely bad news; it converts the investigation into a
  bindings-engineering effort with a larger payoff.
