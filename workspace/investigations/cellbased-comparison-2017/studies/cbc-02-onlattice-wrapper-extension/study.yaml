notes: |
  Mesh generators are imported from chaste.mesh, NOT chaste.cell_based — PottsMeshGenerator,
  HoneycombMeshGenerator, HoneycombVertexMeshGenerator all live there. The probe's first pass
  missed this and wrongly reported them absent.

  Deprecation: the image warns that Foo2_2 spellings are deprecated in favour of
  Foo["2", "2"]. The existing wrapper uses the old spelling throughout. Not urgent, but new code
  should probably adopt the subscript form rather than deepen the debt.
