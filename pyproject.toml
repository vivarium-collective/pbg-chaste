[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "pbg-chaste"
version = "0.1.0"
description = "Process-bigraph wrapper for Chaste multi-cellular + sub-cellular simulation (real engine via the chaste/pychaste Docker image)"
readme = "README.md"
license = {text = "BSD-3-Clause"}
requires-python = ">=3.10"
authors = [{name = "Eran Agmon", email = "agmon.eran@gmail.com"}]
classifiers = [
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "bigraph-schema>=0.0.60",
    "process-bigraph>=0.0.66",
    # Chaste itself runs inside the chaste/pychaste Docker image, not as a
    # pip dependency — see README. Docker is the only host requirement.
]

[project.optional-dependencies]
# Dashboard / workspace integration (vivarium-workbench is not on PyPI; install
# from a sibling checkout). Not needed to run the wrapper or its composites.
workspace = [
    "bigraph-viz>=2.0.3",
    "pyyaml>=6.0",
    "jsonschema[format-nongpl]>=4.21",
    "jinja2>=3.1",
    "pypdf>=4.0",
    "vivarium-workbench",
]
dev = ["pytest", "matplotlib", "plotly", "bigraph-viz2"]

[project.urls]
Homepage = "https://github.com/vivarium-collective/pbg-chaste"
Issues = "https://github.com/vivarium-collective/pbg-chaste/issues"
Upstream = "https://github.com/Chaste/Chaste"

[tool.hatch.build.targets.wheel]
packages = ["pbg_chaste"]
